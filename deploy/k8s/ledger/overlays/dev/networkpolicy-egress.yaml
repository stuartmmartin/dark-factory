# Dev runs Postgres, Kafka and Temporal in-cluster in the dark-factory-infra namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-egress
spec:
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: dark-factory-infra}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 9092}
        - {protocol: TCP, port: 7233}
