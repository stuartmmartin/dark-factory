apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-worker
  labels:
    app.kubernetes.io/name: ledger
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      # Must exceed the worker's graceful_shutdown_timeout (10 s, sb_workflows.worker.build_worker)
      # so in-flight activities finish before SIGKILL.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/stuartmmartin/dark-factory-ledger
          args: ["ledger.worker"]
          envFrom:
            - configMapRef: {name: ledger-config}
            - secretRef: {name: ledger-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
