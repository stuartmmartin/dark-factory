apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-consumer
  labels:
    app.kubernetes.io/name: ledger
    app.kubernetes.io/component: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
      app.kubernetes.io/component: consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
        app.kubernetes.io/component: consumer
    spec:
      automountServiceAccountToken: false
      # run() finishes (commits) the in-flight message before returning on SIGTERM (D11).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: consumer
          image: ghcr.io/stuartmmartin/dark-factory-ledger
          # The outbox relay loop and the inbox consumer. A handler error or a fatal PublishFailed
          # exits non-zero on purpose; the kubelet restarts the container.
          args: ["ledger.consumer"]
          envFrom:
            - configMapRef: {name: ledger-config}
            - secretRef: {name: ledger-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
