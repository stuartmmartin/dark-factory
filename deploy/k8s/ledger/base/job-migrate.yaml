# Runs `python -m ledger.migrate` (create the database if needed, then upgrade to head).
# deploy.yml applies it alone, waits for it to complete, and only then rolls the Deployments.
# A Job's pod template is immutable, so deploy.yml deletes the previous Job before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: ledger-migrate
  labels:
    app.kubernetes.io/name: ledger
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: ghcr.io/stuartmmartin/dark-factory-ledger
          args: ["ledger.migrate"]
          envFrom:
            - configMapRef: {name: ledger-config}
            - secretRef: {name: ledger-secrets}
            # The only workload given the BYPASSRLS migrator and database-admin URLs.
            - secretRef: {name: ledger-migrate-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
