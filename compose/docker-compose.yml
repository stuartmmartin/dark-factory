# Appliances for local development. Started by `make up infra` (profile core).
# Service containers live in compose/services.yml (one profile per service).
# Every published port binds to 127.0.0.1 only: dev credentials never face the network.
services:
  postgres:
    image: postgres:17-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: sb_admin
      POSTGRES_PASSWORD: ${SB_PG_ADMIN_PASSWORD:?set SB_PG_ADMIN_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: postgres
      SB_MIGRATOR_PASSWORD: ${SB_MIGRATOR_PASSWORD:?set SB_MIGRATOR_PASSWORD in .env (see .env.example)}
      SB_APP_PASSWORD: ${SB_APP_PASSWORD:?set SB_APP_PASSWORD in .env (see .env.example)}
      SB_READONLY_PASSWORD: ${SB_READONLY_PASSWORD:?set SB_READONLY_PASSWORD in .env (see .env.example)}
    ports: ["127.0.0.1:${SB_PG_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sb_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:4.1.0
    # Also tagged "init"/"tools": kafka-init and kafka-ui depend_on kafka, and Compose profile
    # scoping requires a depends_on target to be included in the *same* invocation's profile
    # set, not just already running, or it errors "depends on undefined service".
    profiles: ["core", "init", "tools"]
    ports: ["127.0.0.1:${SB_KAFKA_PORT:-9092}:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://127.0.0.1:${SB_KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 40

  kafka-init:
    image: apache/kafka:4.1.0
    profiles: ["init"]
    depends_on:
      kafka: {condition: service_healthy}
    volumes: ["../contracts:/contracts:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for f in /contracts/events/*.json; do
          [ -e "$$f" ] || continue
          t=$$(basename "$$f" .json)
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
        echo "kafka-init: topics ensured"

  temporal:
    image: temporalio/temporal:1.4.1
    profiles: ["core"]
    # Runs as root: the image's default non-root user has no write access to a fresh named
    # volume (Docker creates the mount point root-owned), which makes start-dev fail opening
    # the sqlite file. Dev-only appliance, so running as root is acceptable here.
    user: root
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:${SB_TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${SB_TEMPORAL_UI_PORT:-8233}:8233"
    volumes: ["temporal-data:/data"]
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 3s
      timeout: 5s
      retries: 40

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    profiles: ["tools"]
    depends_on:
      kafka: {condition: service_healthy}
    ports: ["127.0.0.1:${SB_KAFKA_UI_PORT:-8080}:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

volumes:
  pgdata:
  temporal-data:
