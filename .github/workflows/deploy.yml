name: deploy

# Manual deploy of one service to one environment, at a main-branch commit whose image images.yml
# pushed. The image is deployed by digest (the <sha> tag is resolved in the registry first).
#
# Guards in this file: the run must be dispatched from refs/heads/main, and the SHA must be on
# origin/main (`git merge-base --is-ancestor`), so no unreviewed commit can be deployed.
# Provenance: tags are mutable (any workflow with `packages: write` could re-point <sha>), so the
# digest resolved from the tag is trusted only after `gh attestation verify` proves it was built
# by .github/workflows/images.yml in this repository, from refs/heads/main, at exactly <sha>
# (the attestation images.yml pushes with actions/attest-build-provenance). Any mismatch or a
# missing attestation fails the deploy (fail closed).
#
# Required GitHub settings (repo settings, not this file; a human sets them up):
#   - Environments `dev` and `prod`, BOTH with "Deployment branches and tags" restricted to `main`.
#   - `prod` also has "Required reviewers" set, so a prod run waits for a human approval.
#   - KUBECONFIG_B64 is defined ONLY as an Environment secret (one per environment), never as a
#     repository or organisation secret: a base64 kubeconfig for a ServiceAccount bound to a
#     namespace-scoped Role in that environment's namespace. The Role covers what this workflow
#     applies: ConfigMaps, Services, Deployments, Jobs, NetworkPolicies (and pods/log, get/list
#     on pods, for logs and rollout status). It cannot create Namespaces.
#   - The namespaces dark-factory-dev / dark-factory-prod exist, created by a cluster admin from
#     deploy/k8s/cluster-admin/ (Pod Security "restricted" labels); this workflow never creates them.
#
# Order: migrate Job alone -> wait until it completes (fail fast if it fails) -> everything else
# -> rollout status of every Deployment.
on:
  workflow_dispatch:
    inputs:
      service:
        description: Service to deploy (demo_svc or demo-svc; deployed as deploy/k8s/demo-svc/)
        type: string
        required: true
        default: ledger
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        required: true
      sha:
        description: Full 40-character main-branch commit SHA whose image images.yml pushed
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.service }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read # resolve the image digest in GHCR
      attestations: read # gh attestation verify
    env:
      SERVICE: ${{ inputs.service }}
      ENVIRONMENT: ${{ inputs.environment }}
      SHA: ${{ inputs.sha }}
      OWNER: ${{ github.repository_owner }}
      REF: ${{ github.ref }}
    steps:
      # Inputs reach the shell only through env, and are validated before anything uses them.
      # The service may be given as its package name (demo_svc) or its k8s name (demo-svc); every
      # later step uses APP, the hyphenated form: the k8s directory, resource names and image
      # (Kubernetes names are DNS labels, so `_` is never allowed in them).
      - name: Validate inputs
        run: |
          [ "$REF" = "refs/heads/main" ] || { echo "::error::deploy must be dispatched from main (got $REF)"; exit 1; }
          [[ "$SERVICE" =~ ^[a-z][a-z0-9]*([_-][a-z0-9]+)*$ && ${#SERVICE} -le 40 ]] || { echo "::error::invalid service"; exit 1; }
          [[ "$ENVIRONMENT" =~ ^(dev|prod)$ ]] || { echo "::error::invalid environment"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-char lowercase commit SHA"; exit 1; }
          echo "APP=${SERVICE//_/-}" >> "$GITHUB_ENV"
      # Manifests from the same commit as the image. fetch-depth 0 also fetches origin/main.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the SHA to be on main
        run: |
          git rev-parse --verify --quiet "origin/main^{commit}" >/dev/null || { echo "::error::origin/main not fetched"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on origin/main"; exit 1; }
      - name: Resolve overlay
        run: |
          overlay="deploy/k8s/${APP}/overlays/${ENVIRONMENT}"
          test -f "$overlay/kustomization.yaml" || { echo "::error::no overlay $overlay"; exit 1; }
          {
            echo "OVERLAY=$overlay"
            echo "NAMESPACE=dark-factory-${ENVIRONMENT}"
            echo "IMAGE=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/dark-factory-${APP}"
          } >> "$GITHUB_ENV"
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          install_args: kustomize
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.34.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Deploy by digest: the tag is resolved once, here, so every workload runs the same bytes.
      - name: Resolve image digest
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${SHA}" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image ${IMAGE}:${SHA} (got '$digest')"; exit 1; }
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Deploying \`${IMAGE}@${digest}\` (${SHA})" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --cert-identity pins the signer to images.yml at refs/heads/main of this repository
          # (gh refuses it together with the signer-workflow flag); GitHub-hosted runners only.
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/images.yml@refs/heads/main" \
            --deny-self-hosted-runners \
            --source-ref refs/heads/main \
            --source-digest "$SHA"
      - name: Kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64" || { echo "::error::KUBECONFIG_B64 is not set for $ENVIRONMENT"; exit 1; }
          umask 077
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Set image
        working-directory: ${{ env.OVERLAY }}
        run: kustomize edit set image "ghcr.io/stuartmmartin/dark-factory-${APP}=${IMAGE}@${DIGEST}"
      # Every rendered `image:` must be exactly the verified digest: a manifest whose image name
      # does not match the base's (so `set image` silently skipped it) fails here.
      - name: Render
        run: |
          kustomize build "$OVERLAY" > "$RUNNER_TEMP/rendered.yaml"
          images=$(grep -E '^[[:space:]]*(- )?image:' "$RUNNER_TEMP/rendered.yaml" | sed -E 's/^[[:space:]]*(- )?image:[[:space:]]*//; s/^"//; s/"$//' | sort -u)
          [ -n "$images" ] || { echo "::error::no image fields rendered"; exit 1; }
          if [ "$images" != "${IMAGE}@${DIGEST}" ]; then
            echo "::error::rendered images differ from ${IMAGE}@${DIGEST}:"; printf '%s\n' "$images"; exit 1
          fi
      # A Job's pod template is immutable: remove the previous run (if its TTL has not already),
      # then apply the migrate Job with its prerequisites (ConfigMap, NetworkPolicies) but none of
      # the workloads that would run against an unmigrated schema. Poll the Job's status so a
      # failed migration fails the deploy at once instead of sitting out the timeout.
      - name: Migrate
        run: |
          job="${APP}-migrate"
          kubectl -n "$NAMESPACE" delete job "$job" --ignore-not-found --wait=true
          kubectl apply -k "$OVERLAY" -l 'app.kubernetes.io/component notin (api,worker,consumer)'
          deadline=$((SECONDS + 600))
          while :; do
            complete=$(kubectl -n "$NAMESPACE" get job "$job" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')
            failed=$(kubectl -n "$NAMESPACE" get job "$job" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')
            if [ "$complete" = "True" ]; then echo "migration complete"; break; fi
            if [ "$failed" = "True" ]; then echo "::error::migration job failed"; exit 1; fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo "::error::migration timed out after 10m"; exit 1; fi
            sleep 5
          done
      - name: Migrate logs
        if: ${{ failure() }}
        run: kubectl -n "$NAMESPACE" logs "job/${APP}-migrate" --tail=200 || true
      - name: Apply
        run: kubectl apply -k "$OVERLAY" -l 'app.kubernetes.io/component!=migrate'
      # Every Deployment is checked, and all results are reported before the step fails.
      # Note: prod runs auth_mode=oidc, which is not implemented, so the prod API crash-loops and
      # this step fails there until OIDC lands (fail closed, see overlays/prod/kustomization.yaml).
      - name: Rollout status
        run: |
          deps=$(kubectl -n "$NAMESPACE" get deployment -l "app.kubernetes.io/name=${APP}" -o name)
          [ -n "$deps" ] || { echo "::error::no Deployments labelled app.kubernetes.io/name=${APP} in $NAMESPACE"; exit 1; }
          failed=()
          for d in $deps; do
            if ! kubectl -n "$NAMESPACE" rollout status "$d" --timeout=10m; then
              failed+=("$d")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::rollout failed: ${failed[*]}"
            exit 1
          fi
