[project]
name = "sb-workflows"
version = "0.1.0"
description = "Temporal client with the pydantic data converter, sandboxed worker builder, deterministic workflow ids, time-skipping test env."
requires-python = ">=3.13,<3.14"
# sb-kernel and pydantic are deliberately not runtime deps: the code only names them as strings
# (worker.PASSTHROUGH_MODULES) and reaches pydantic through temporalio[pydantic]. tach
# check-external fails on declared-but-unimported deps. Tests import both (dev group).
dependencies = [
  "temporalio[pydantic]>=1.9",
]

[dependency-groups]
dev = ["sb-testing", "sb-kernel", "pydantic>=2.9"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
